<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>과학 형성평가</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="과학 형성평가">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#05060f;color:#e6f6ff;
    font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05060f;
    opacity:0;transition:opacity .4s}
  #frame.on{opacity:1}

  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:28px;text-align:center;z-index:10;
    background:
      radial-gradient(700px 500px at 15% 0%,rgba(168,85,247,.30),transparent 60%),
      radial-gradient(700px 500px at 85% 100%,rgba(34,211,238,.25),transparent 60%),
      #05060f;
    transition:opacity .4s}
  #splash.off{opacity:0;pointer-events:none}
  .ring{width:62px;height:62px;border-radius:50%;
    border:3px solid rgba(34,211,238,.15);border-top-color:#22d3ee;border-right-color:#f0f;
    animation:sp .9s linear infinite;box-shadow:0 0 26px rgba(34,211,238,.55)}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-family:'Orbitron','Noto Sans KR',sans-serif;font-weight:900;letter-spacing:.06em;
    font-size:clamp(22px,6vw,32px);margin:0;color:#eafcff;
    text-shadow:0 0 4px #fff,0 0 14px #f0f,0 0 34px #f0f;animation:fl 6s infinite}
  @keyframes fl{0%,17%,19%,21%,23%,25%,54%,56%,100%{opacity:1}18%,20%,22%,24%,55%{opacity:.7}}
  p{margin:0;font-size:13px;color:#8ea6c8;line-height:1.7;max-width:340px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;
    border-radius:12px;cursor:pointer;text-decoration:none;
    font-family:'Orbitron','Noto Sans KR',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
    background:transparent;color:#a3e635;border:1.5px solid #a3e635;
    box-shadow:0 0 12px rgba(163,230,53,.4);text-shadow:0 0 8px rgba(163,230,53,.8)}
  .btn.c{color:#22d3ee;border-color:#22d3ee;box-shadow:0 0 12px rgba(34,211,238,.4);
    text-shadow:0 0 8px rgba(34,211,238,.8)}
  .hid{display:none!important}
  code{background:rgba(2,6,23,.85);border:1px solid rgba(103,232,249,.25);border-radius:7px;
    padding:3px 8px;font-size:12px;color:#67e8f9;word-break:break-all}
</style>
</head>
<body>

<iframe id="frame" allow="clipboard-write" title="과학 형성평가"></iframe>

<div id="splash">
  <h1>POP QUIZ</h1>
  <div class="ring" id="ring"></div>
  <p id="msg">불러오는 중…</p>
  <a class="btn hid" id="open" target="_blank" rel="noopener">브라우저에서 열기</a>
  <a class="btn c hid" id="retry" href="./">다시 시도</a>
</div>

<script src="config.js"></script>
<script>
(function () {
  var URL_ = (window.APP_URL || '').trim();
  var frame = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var msg = document.getElementById('msg');
  var ring = document.getElementById('ring');
  var open_ = document.getElementById('open');
  var retry = document.getElementById('retry');

  function fail(text, showOpen) {
    ring.classList.add('hid');
    msg.innerHTML = text;
    if (showOpen && URL_) { open_.href = URL_ + '?go=1'; open_.classList.remove('hid'); }
    retry.classList.remove('hid');
  }

  // 주소가 아직 설정되지 않은 경우
  if (!URL_ || URL_.indexOf('http') !== 0) {
    fail('아직 준비 중입니다.<br><br>선생님께: 저장소의 <code>config.js</code> 파일을 열어 ' +
         '<code>APP_URL</code> 에 Apps Script의 <code>/exec</code> 주소를 넣고 저장하세요.', false);
    return;
  }

  var loaded = false;
  frame.addEventListener('load', function () {
    loaded = true;
    frame.classList.add('on');
    splash.classList.add('off');
  });

  frame.src = URL_ + '?go=1';

  // 화면 안에 뜨지 않으면 (아이프레임 차단·네트워크 지연 등) 안내
  setTimeout(function () {
    if (!loaded) {
      fail('연결이 느리거나 화면 안에서 열리지 않았습니다.<br>아래 버튼으로 열어 주세요.', true);
    }
  }, 8000);

  // 서비스워커 — 아이콘을 눌렀을 때 즉시 뜨게 함
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  }
})();
</script>
</body>
</html>
